# nanochat's CPU training speedrun, searched by autoresearch (plan 16a of
# pi-autoresearch-serverless): agents change nanochat's model and training code so that a model
# trained for a fixed wall-clock budget on 8 vCPUs predicts held-out text better. Each round runs
# scripts/speedrun.py, which trains and writes the model as ONNX; eval/check refuses a round over the
# budget, a model that breaks the contract (SPEEDRUN.md) or looks ahead; eval/score gives the model's
# bits per byte on held-out text, in $SECRET, which no run sees. The harness never runs the
# candidate's code: models run in onnxruntime, as data. ORT_DISABLE_TELEMETRY=1: onnxruntime would
# otherwise open network sockets for its telemetry, which the sandbox denies.
#
# Learning curves (plan 16e): each round writes a snapshot of its model at each tenth of its training
# time to $CHECKPOINTS; eval/diagnose scores the first measured round's on the diagnostic text, in
# $DIAGNOSTIC, which nothing selects on, for agents to see; eval/score logs their val curve for the
# owner alone. Each curve is drawn twice (plan 16f): by time, the budget's unit, and by tokens
# trained, which each model records in its ONNX metadata, and which a change of batch size leaves
# comparable.

[agents]
max_tokens = 3000000

# A search biased toward its promising branches (plan 16a, with the user): half UCB's exploration
# bonus, two children an expansion, and branches pruned once 2% behind the incumbent, beyond their
# noise; 80 experiments at most, about 33 minutes each.
[search]
children_per_expansion = 2
ucb_c_sigma = 1.0
prune_margin = 0.02

[limits]
max_experiments = 80

[metric]
name = "val_bpb"
direction = "minimize"
scale = "ratio"
source = "score"

[scope]
allow  = ["scripts/speedrun.py", "nanochat/gpt.py", "nanochat/optim.py", "nanochat/dataloader.py", "nanochat/common.py", "nanochat/flash_attention.py", "nanochat/export.py"]
locked = ["nanochat/onnx_rules.py", "nanochat/tokenizer.py", "nanochat/dataset.py", "SPEEDRUN.md", "pyproject.toml", "uv.lock", "requirements*", ".python-version", "bench/**", "eval/**"]
secret = ["eval/secret/**"]
diagnostic = ["eval/diagnostic/**"]

[image]
# python:3.13-bookworm, by its multi-arch digest: the python template's base.
base  = "docker.io/library/python@sha256:3856e3e7bf4d0ba061501a84ed2eb0d429663307c0f54f191dc4de03c7081c3e"
fetch = "sh bench/fetch"

[build]
outputs = ["nanochat/**", "scripts/**"]

[steps]
build = { cmd = "python -m compileall -q nanochat scripts", timeout_secs = 120 }
run   = { cmd = "env PYTHONPATH=$BUILD NANOCHAT_BASE_DIR=/opt/nanochat TORCHINDUCTOR_COMPILE_THREADS=1 ORT_DISABLE_TELEMETRY=1 python -m scripts.speedrun --wall-secs 300 --out $OUTPUTS --checkpoints $CHECKPOINTS", timeout_secs = 360 }
check = { cmd = "env ORT_DISABLE_TELEMETRY=1 python -I eval/check.py $ROUNDS $BASELINE_OUT $CANDIDATE_OUT $SECRET --wall-secs 300 --rounds 3", timeout_secs = 600 }
score = { cmd = "env ORT_DISABLE_TELEMETRY=1 python -I eval/score.py $OUTPUTS $SECRET --checkpoints $CHECKPOINTS --wall-ms $WALL_MS", timeout_secs = 120 }
diagnose = { cmd = "env ORT_DISABLE_TELEMETRY=1 python -I eval/diagnose.py $CHECKPOINTS $OUTPUTS $WALL_MS $DIAGNOSTIC", timeout_secs = 180 }

[diagnose]
curves = ["bpb_time", "bpb_tokens"]
values = ["bpb_pos_0_63", "bpb_pos_64_255", "bpb_pos_256_511"]
axes = { bpb_time = { x = "seconds since the round's start", y = "bits per byte" }, bpb_tokens = { x = "tokens trained", y = "bits per byte" } }

[paired]
# The metric is no time: nothing to warm up. Each round trains from a seed of its own.
warmup = 0
rounds = 3

[resources]
cpu = 8
memory_gib = 8
# 6 rounds of at most 360 s, the check's 600, 6 scores of 120 and 2 diagnoses of 180, and the build
# and startup.
task_timeout_secs = 3960
